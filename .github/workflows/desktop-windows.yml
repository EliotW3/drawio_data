# Builds the drawio-data desktop app for Windows (desktop/, see desktop/README.md).
# Run it by hand from the Actions tab to get the installer as a build artifact,
# or push a tag desktop-vX.Y.Z to also publish it as a GitHub Release.
#
# The main-process tests come from draw.io desktop, which runs them on macOS
# and Linux only (they assume POSIX paths), so they run on Linux here and the
# Windows job only builds the installer.

name: Desktop app (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: desktop/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Test the main process
      run: npm test

  build:
    needs: test
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: desktop/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build the installer
      run: npm run dist-win

    - name: Upload the installer
      uses: actions/upload-artifact@v6
      with:
        name: drawio-data-windows-installer
        path: desktop/dist/*.exe

    - name: Publish the release
      if: startsWith(github.ref, 'refs/tags/desktop-v')
      uses: softprops/action-gh-release@v3
      with:
        name: drawio-data desktop ${{ github.ref_name }}
        body: |
          Windows installer for drawio-data, draw.io with data flow diagrams.

          Download `drawio-data-*-windows-installer.exe` and run it. The installer
          is not code-signed, so Windows SmartScreen may warn: choose
          "More info" and then "Run anyway".
        files: desktop/dist/*.exe
